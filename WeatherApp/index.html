<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="/WeatherApp/style.css">
  </head>
  <body>
    <div class="container">

  </body>
</html>
